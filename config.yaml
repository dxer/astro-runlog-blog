# ==============================================================================
# 🚀 Runlog 全局站点配置文件 (Single Source of Truth)
# 所有可见文案、模块开关、文章分类与终端动画均在此配置，无需修改任何代码。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 站点基础信息 (Site Info)
# ------------------------------------------------------------------------------
site:
  # 站点名称（显示在左上角 Logo、网页标题 title、页脚版权等）
  name: "Runlog"

  # 默认作者名
  author: "Alex Chen"

  # 站点正式上线域名（用于 SEO、Canonical 链接与 RSS 订阅源生成）
  url: "https://gg.rekcore.com"

  # 站点全局描述（用于页脚简介、页面 <meta description> 搜索引擎优化）
  description: "投资复盘、认知成长与技术系统的结构化日志。"

  # 界面 UI 语言设置: "zh-CN" (默认中文) 或 "en" (全站原生英文)
  # 切换后，搜索框占位符、阅读时间、日期格式、按钮文案、TOC 目录均自动切换对应语言
  locale: "zh-CN"

  # Google Analytics 4 衡量 ID（如 G-XXXXXXXXXX），留空则不开启统计脚本
  googleAnalyticsId: ""

  # 顶部右侧与移动端菜单的主行动按钮
  cta:
    label: "阅读文章"
    href: "/posts"

# ------------------------------------------------------------------------------
# 2. 首页模块显示开关 (Section Flags)
# 每个人关注的方向不同，不需要的模块直接设为 false 即可一键隐藏，布局不乱。
# ------------------------------------------------------------------------------
sections:
  terminal: true     # 是否展示 Hero 右侧极客终端控制台
  pillars: true      # 是否展示核心领域支柱（自动由 categories 渲染）
  framework: true    # 是否展示决策/认知闭环框架 (INPUT -> ACT -> VERIFY)
  recentPosts: true  # 是否在首页展示最新文章精选
  principles: true   # 是否展示底层思维模型与准则
  cta: true          # 是否展示首页底部归档行动条

# ------------------------------------------------------------------------------
# 3. 首页 Hero 区域文案定制
# ------------------------------------------------------------------------------
hero:
  label: "insight ledger · 思考与复盘日志"
  title: "独立思考，长期复利。"
  lede: |
    记录投资决策、个人成长、商业认知与技术系统的结构化日志。
    剥离情绪噪音，追求确定性与知行合一。
  code: "$ ls -la /posts"
  primaryButton:
    label: "开始阅读文章 ->"
    href: "/posts"
  secondaryButton:
    label: "核心思考模型 ->"
    href: "#principles"

# ------------------------------------------------------------------------------
# 4. Hero 右侧极客终端模拟器 (Terminal Console)
# 模拟你的日常思考、研究流程或系统运作，可自由修改步骤和文字。
# ------------------------------------------------------------------------------
terminal:
  filename: "decision_ledger.log"
  stream: "investment & growth"
  status: "compounding"
  steps:
    - { kind: "macro", call: "scan: 追踪宏观周期、流动性与估值分位数", ms: 650 }
    - { kind: "filter", call: "filter: 排除短期市场情绪干扰，坚守第一性原理", ms: 950 }
    - { kind: "margin", call: "eval: 测算自由现金流折现，确立 30%+ 安全边际", ms: 1300 }
    - { kind: "action", call: "action: 知行合一，按规则分批建仓与资产再平衡", ms: 1100 }
    - { kind: "review", call: "review: 归档决策假设，接受事实检验，复利迭代", ms: 800 }
  footer:
    - { label: "核心领域", value: "投资 · 成长 · 技术" }
    - { label: "决策法则", value: "第一性原理" }
    - { label: "运行状态", value: "长期主义执行中" }

# ------------------------------------------------------------------------------
# 5. 文章分类体系 (Categories)
# 全站核心分类。修改此处后，全站导航栏、页脚专题、文章筛选标签全自动同步！
# ------------------------------------------------------------------------------
categories:
  - slug: "investment"
    label: "投资与商业"
    en: "Investment & Business"
    description: "价值投资、商业模式、周期律动与资产配置"

  - slug: "growth"
    label: "认知与成长"
    en: "Growth & Mindset"
    description: "多元思维模型、决策框架与终身学习沉淀"

  - slug: "engineering"
    label: "技术与系统"
    en: "Engineering & Systems"
    description: "软件架构设计、极客工具链与自动化实践"

  - slug: "essays"
    label: "随笔与杂谈"
    en: "Essays & Reflection"
    description: "读书笔记、非共识洞察与生活哲思记录"

# ------------------------------------------------------------------------------
# 6. 决策与认知闭环框架 (Loop Framework)
# 如果在 sections 中 framework 设为 false，则首页不渲染该区域。
# ------------------------------------------------------------------------------
framework:
  label: "framework"
  title: |
    输入. 执行. 复盘.
    构建认知闭环。
  lede: "决策不是猜测，而是建立在安全边际、第一性原理与持续证伪基础上的长期复利过程。"
  loop:
    - idx: "01"
      name: "INPUT"
      title: "信息输入与过滤"
      body: "探寻底层第一性原理，获取高信噪比源泉，过滤短期市场情绪干扰。"
      out: "input  source.high_snr  first_principles"
    - idx: "02"
      name: "ACT"
      title: "决策与纪律执行"
      body: "知行合一，严格按既定框架与安全边际执行，杜绝非理性冲动。"
      out: "execute  portfolio.rebalance  disciplined"
    - idx: "03"
      name: "VERIFY"
      title: "定期证伪与复盘"
      body: "复盘实际结果与当初假设的偏差，敢于修正认知，形成长期复利。"
      out: "review  thesis.evaluated  compounding ✓"

# ------------------------------------------------------------------------------
# 7. 底层思维模型与准则 (Principles)
# 如果在 sections 中 principles 设为 false，则首页不渲染该区域。
# ------------------------------------------------------------------------------
principlesSection:
  label: "principles"
  title: |
    经受时间检验的
    底层思维模型。
  lede: "大道至简。在纷繁复杂的不确定性世界中，依靠少数根本性原则导航。"
  items:
    - { id: "01", name: "安全边际", rule: "Margin of Safety", note: "宁要模糊的正确，不要精确的错误；为未知预留犯错空间。" }
    - { id: "02", name: "能力圈", rule: "Circle of Competence", note: "坚守已知边界，在自身能力圈内重注，对未知常怀敬畏。" }
    - { id: "03", name: "逆向思维", rule: "Inversion Thinking", note: "反过来想，总是反过来想；先找出毁灭路径并全力规避。" }
    - { id: "04", name: "复利效应", rule: "Compound Growth", note: "不仅财富遵循复利，深度思考与心智进化同样非线性爆发。" }
    - { id: "05", name: "反脆弱性", rule: "Antifragility", note: "保持充足现金冗余，在不确定性与市场波动中获取主动权。" }
    - { id: "06", name: "知行合一", rule: "Skin in the Game", note: "唯有承担实际决策后果，真实见解才能淬炼成真正的智慧。" }

# ------------------------------------------------------------------------------
# 8. 底部行动条文案 (Footer CTA)
# ------------------------------------------------------------------------------
ctaSection:
  label: "archive & index"
  title: "知行合一，静候时间复利。"
  lede: "不设门槛，不加冗余。所有思考与笔记均以纯文本开放索引。"
  primaryButton:
    label: "浏览全部文章列表 ->"
    href: "/posts"
  secondaryButton:
    label: "LLM 纯文本索引 ->"
    href: "/llms.txt"
