# ==============================================================================
# 💻 预设模版：极客工程、系统架构与 AI Agent 版 (Developer & Systems)
# ==============================================================================

site:
  name: "DevLog"
  author: "Hacker"
  url: "https://example.com"
  description: "Systems architecture, AI tooling, and low-level engineering ledger."
  locale: "en"
  googleAnalyticsId: ""
  cta:
    label: "Explore Posts"
    href: "/posts"

sections:
  terminal: true     # 展示构建与部署终端
  pillars: true      # 展示核心技术栈支柱
  framework: false   # 极客版通常不需要繁琐的心智模型，一键隐藏
  recentPosts: true  # 展示最新技术博客
  principles: false  # 一键隐藏哲学准则
  cta: true          # 展示底部代码索引

hero:
  label: "systems.engineering · 极客工程手记"
  title: |
    代码，架构，
    与长期系统工程。
  lede: |
    专注于全栈开发、高可用系统设计、自动化工具链与自主 Agent 探索。
    用纯粹的代码与测试说话。
  code: "$ pnpm dev --verbose"
  primaryButton:
    label: "浏览技术文章 ->"
    href: "/posts"
  secondaryButton:
    label: "开源项目 ->"
    href: "https://github.com"

terminal:
  filename: "ci_pipeline.log"
  stream: "main branch / production"
  status: "passing"
  steps:
    - { kind: "fetch", call: "git: pull latest commits & sync monorepo", ms: 450 }
    - { kind: "build", call: "turbo: compile typescript & bundle wasm", ms: 850 }
    - { kind: "eval", call: "bench: test 41M tool-calls across 4 clusters", ms: 1200 }
    - { kind: "verify", call: "lint: 100% type coverage, 0 vulnerabilities", ms: 600 }
    - { kind: "deploy", call: "edge: zero-downtime deploy to global points", ms: 500 }
  footer:
    - { label: "技术栈", value: "TypeScript · Rust · Astro" }
    - { label: "测试覆盖", value: "98.4% passing" }
    - { label: "服务状态", value: "99.99% uptime" }

categories:
  - slug: "engineering"
    label: "架构与系统"
    en: "Architecture & Systems"
    description: "分布式架构设计、微服务与高可靠性系统实战"

  - slug: "ai"
    label: "AI 与智能体"
    en: "AI & Agents"
    description: "大模型应用开发、Eval 评测集与自主 Agent 工作流"

  - slug: "toolchain"
    label: "极客工具链"
    en: "Tooling & DX"
    description: "CLI 开发、自动化脚本与高效开发者体验实践"

ctaSection:
  label: "open-source & ledger"
  title: "开源开放，终身迭代。"
  lede: "所有代码与技术方案均遵循开源精神，提供机器友好的 llms.txt 与完整 RSS 订阅。"
  primaryButton:
    label: "查看所有博文 ->"
    href: "/posts"
  secondaryButton:
    label: "LLM 纯文本 ->"
    href: "/llms.txt"
