# ==============================================================================
# 📈 预设模版：价值投资、宏观复盘与商业思考版 (Investor & Capital Ledger)
# ==============================================================================

site:
  name: "Runlog"
  author: "Alex Chen"
  url: "https://gg.rekcore.com"
  description: "投资复盘、认知成长与商业周期的结构化日志。"
  locale: "zh-CN"
  googleAnalyticsId: ""
  cta:
    label: "阅读手记"
    href: "/posts"

sections:
  terminal: true     # 展示投资与决策流模拟器
  pillars: true      # 展示核心领域支柱
  framework: true    # 展示三步认知闭环 (输入 -> 决策 -> 复盘)
  recentPosts: true  # 展示近期复盘
  principles: true   # 展示投资底层心智模型
  cta: true          # 展示底部归档入口

hero:
  label: "insight ledger · 投资与复盘日志"
  title: "独立思考，长期复利。"
  lede: |
    记录投资决策、个人成长、商业认知与资产配置的结构化日志。
    剥离情绪噪音，追求确定性与知行合一。
  code: "$ ls -la /posts"
  primaryButton:
    label: "开始阅读文章 ->"
    href: "/posts"
  secondaryButton:
    label: "核心思考模型 ->"
    href: "#principles"

terminal:
  filename: "decision_ledger.log"
  stream: "investment & capital"
  status: "compounding"
  steps:
    - { kind: "macro", call: "scan: 追踪宏观周期、流动性与估值分位数", ms: 650 }
    - { kind: "filter", call: "filter: 排除短期市场情绪干扰，坚守第一性原理", ms: 950 }
    - { kind: "margin", call: "eval: 测算自由现金流折现，确立 30%+ 安全边际", ms: 1300 }
    - { kind: "action", call: "action: 知行合一，按规则分批建仓与资产再平衡", ms: 1100 }
    - { kind: "review", call: "review: 归档决策假设，接受事实检验，复利迭代", ms: 800 }
  footer:
    - { label: "核心领域", value: "投资 · 成长 · 商业" }
    - { label: "决策法则", value: "安全边际" }
    - { label: "运行状态", value: "长期主义执行中" }

categories:
  - slug: "investment"
    label: "投资与商业"
    en: "Investment & Business"
    description: "价值投资、商业模式、周期律动与资产配置"

  - slug: "growth"
    label: "认知与成长"
    en: "Growth & Mindset"
    description: "多元思维模型、决策框架与终身学习沉淀"

  - slug: "essays"
    label: "随笔与杂谈"
    en: "Essays & Reflection"
    description: "读书笔记、非共识洞察与生活哲思记录"

framework:
  label: "framework"
  title: |
    输入. 执行. 复盘.
    构建认知闭环。
  lede: "决策不是猜测，而是建立在安全边际、第一性原理与持续证伪基础上的长期复利过程。"
  loop:
    - idx: "01"
      name: "INPUT"
      title: "信息输入与过滤"
      body: "探寻底层第一性原理，获取高信噪比源泉，过滤短期市场情绪干扰。"
      out: "input  source.high_snr  first_principles"
    - idx: "02"
      name: "ACT"
      title: "决策与纪律执行"
      body: "知行合一，严格按既定框架与安全边际执行，杜绝非理性冲动。"
      out: "execute  portfolio.rebalance  disciplined"
    - idx: "03"
      name: "VERIFY"
      title: "定期证伪与复盘"
      body: "复盘实际结果与当初假设的偏差，敢于修正认知，形成长期复利。"
      out: "review  thesis.evaluated  compounding ✓"

principlesSection:
  label: "principles"
  title: |
    经受时间检验的
    底层思维模型。
  lede: "大道至简。在纷繁复杂的不确定性世界中，依靠少数根本性原则导航。"
  items:
    - { id: "01", name: "安全边际", rule: "Margin of Safety", note: "宁要模糊的正确，不要精确的错误；为未知预留犯错空间。" }
    - { id: "02", name: "能力圈", rule: "Circle of Competence", note: "坚守已知边界，在自身能力圈内重注，对未知常怀敬畏。" }
    - { id: "03", name: "逆向思维", rule: "Inversion Thinking", note: "反过来想，总是反过来想；先找出毁灭路径并全力规避。" }
    - { id: "04", name: "复利效应", rule: "Compound Growth", note: "不仅财富遵循复利，深度思考与心智进化同样非线性爆发。" }
    - { id: "05", name: "反脆弱性", rule: "Antifragility", note: "保持充足现金冗余，在不确定性与市场波动中获取主动权。" }
    - { id: "06", name: "知行合一", rule: "Skin in the Game", note: "唯有承担实际决策后果，真实见解才能淬炼成真正的智慧。" }

ctaSection:
  label: "archive & index"
  title: "知行合一，静候时间复利。"
  lede: "不设门槛，不加冗余。所有思考与笔记均以纯文本开放索引。"
  primaryButton:
    label: "浏览全部手记 ->"
    href: "/posts"
  secondaryButton:
    label: "LLM 纯文本索引 ->"
    href: "/llms.txt"
