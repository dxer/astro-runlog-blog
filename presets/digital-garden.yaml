# ==============================================================================
# 🌿 预设模版：个人数字花园与常青思考版 (Digital Garden & Thought Notes)
# ==============================================================================

site:
  name: "Garden"
  author: "Thinker"
  url: "https://example.com"
  description: "读书笔记、通识思考与常青知识库的沉淀空间。"
  locale: "zh-CN"
  googleAnalyticsId: ""
  cta:
    label: "漫步花园"
    href: "/posts"

sections:
  terminal: false    # 极简文学/通识风格，关闭终端动画
  pillars: true      # 展示主要知识领域
  framework: false   # 关闭框架
  recentPosts: true  # 展示近期随笔
  principles: true   # 展示个人处世哲学与认知卡片
  cta: true          # 展示底部指引

hero:
  label: "digital garden · 个人数字花园"
  title: |
    记录灵感，
    培育常青思想。
  lede: |
    这是一个慢节奏的思考温室。不追逐瞬息万变的热点，
    只专注于经受时间沉淀的书籍、通识认知与个人生活哲学。
  code: "$ open digital-garden"
  primaryButton:
    label: "进入文章归档 ->"
    href: "/posts"
  secondaryButton:
    label: "关于花园准则 ->"
    href: "#principles"

categories:
  - slug: "books"
    label: "读书笔记"
    en: "Reading Notes"
    description: "历史、哲学、心理学与经典著作精读随想"

  - slug: "mindset"
    label: "心智进化"
    en: "Mindset & Life"
    description: "认知升级、情绪解构与心流生活实践"

  - slug: "essays"
    label: "散落随笔"
    en: "Essays & Musings"
    description: "非共识思考、观察日记与偶尔的感性记录"

principlesSection:
  label: "philosophy"
  title: |
    心智锚点与
    生活哲学。
  lede: "在喧嚣浮躁的时代，为自己的精神世界设立清晰的边界。"
  items:
    - { id: "01", name: "常青优先", rule: "Evergreen Notes", note: "少关注一周后就失效的资讯，多沉淀十年后依然有价值的真知。" }
    - { id: "02", name: "低信息素", rule: "Low Information Diet", note: "严控垃圾信息输入，把心智带宽留给深度阅读与自主创造。" }
    - { id: "03", name: "卡片盒思维", rule: "Zettelkasten", note: "思想以原子卡片的形式生长，让不同的概念自由碰撞与交织。" }

ctaSection:
  label: "slow read"
  title: "静水流深，常青不败。"
  lede: "欢迎使用 RSS 离线订阅慢读，或通过全文搜索漫步不同主题。"
  primaryButton:
    label: "探索所有文章 ->"
    href: "/posts"
  secondaryButton:
    label: "RSS 订阅源 ->"
    href: "/rss.xml"
